name: Live site check

# असली (live) साइट पर वही browser वाली जाँचें, GitHub की machine से (बिना किसी बीच वाले proxy के)।
# deploy के बाद हाथ से चलाएँ: Actions → "Live site check" → Run workflow। अपने-आप नहीं चलता
# (Free plan पर बार-बार जगाने से Render के मुफ़्त घंटे ख़र्च होते हैं)।
on:
  workflow_dispatch:
    inputs:
      url:
        description: "साइट का पता"
        required: false
        default: "https://thagi-rakshak.onrender.com"

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ inputs.url || vars.SITE_URL || 'https://thagi-rakshak.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Browser (Chromium) install
        run: npx playwright install --with-deps chromium

      - name: साइट जगाना (Free plan पर सोई हो सकती है)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 90 "$BASE_URL/api/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "साइट जवाब नहीं दे रही"; exit 1

      - name: live browser जाँच
        run: |
          failed=0
          for s in site gyan legal pucho case abhyas poster console seo a11y turant; do
            echo "=== $s"
            node scripts/e2e-$s.mjs || failed=1
          done
          exit $failed
