name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# एक ही branch पर नया push आए तो पुरानी चल रही CI रोक दो (Actions-मिनट बचते हैं)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # पहरेदार: production dependencies में कोई *critical* कमज़ोरी आए तो build रुके
      - name: Dependency gate (critical)
        run: npm audit --omit=dev --audit-level=critical

      - name: Production build
        run: npm run build

      - name: TypeScript type check
        run: npm run typecheck

      - name: Smoke test (app चालू करके /api/health जाँचना)
        run: |
          npm start > next.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then
              echo
              ok=1
              break
            fi
            sleep 2
          done
          pkill -f next-server || true
          if [ "$ok" -ne 1 ]; then
            echo "health check failed"
            cat next.log
            exit 1
          fi

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Browser (Chromium) install
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: browser जाँच (/turant, होम, menu, /pucho, /bharosa, /haq, /gyan, /legal + निजता का सबूत)
        run: |
          npm start > next.log 2>&1 &
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then echo "app चालू नहीं हुआ"; cat next.log; exit 1; fi
          node scripts/e2e-turant.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-site.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-haq.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-gyan.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-legal.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-pucho.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-case.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-abhyas.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-poster.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-a11y.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-console.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          node scripts/e2e-seo.mjs || { echo "--- next.log ---"; cat next.log; exit 1; }
          pkill -f next-server || true
